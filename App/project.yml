name: CourtListeningApp
options:
  bundleIdPrefix: com.courtlistening
  createIntermediateGroups: true

packages:
  CourtListening:
    path: ..

targets:
  CourtListeningApp:
    type: application
    # Single multiplatform target (iOS + macOS) — no #if os in app code.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - Sources
    dependencies:
      - package: CourtListening
        product: CourtListeningUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtlistening.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CourtListening
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
